<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Mercado</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            padding-bottom: 50px;
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .item-comprado {
            background-color: #d1e7dd !important;
            border-color: #badbcc;
        }
        .item-comprado .item-nome {
            color: #0f5132;
            text-decoration: line-through;
            font-weight: bold;
        }
        .price-input {
            width: 110px;
            text-align: right;
        }
        .cursor-pointer {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container app-container">
    <h2 class="text-center mb-4">🛒 Lista de Mercado</h2>

    <!-- Adicionar Item -->
    <div class="input-group mb-4">
        <input type="text" id="novoItem" class="form-control form-control-lg" placeholder="O que vamos comprar?">
        <button class="btn btn-primary" onclick="adicionarItem()">Adicionar</button>
    </div>

    <!-- Lista de Itens -->
    <ul class="list-group mb-4" id="listaItens">
        <!-- Os itens aparecerão aqui via JavaScript -->
    </ul>

    <!-- Total -->
    <div class="alert alert-info text-end fs-4 fw-bold">
        Total: R$ <span id="valorTotal">0.00</span>
    </div>

    <!-- Botões de Ação -->
    <div class="d-grid gap-2">
        <button class="btn btn-outline-success" onclick="salvarComoModelo()">Salvar para Próxima Compra (Comparação)</button>
        <button class="btn btn-outline-secondary" onclick="carregarModelo()">Iniciar Nova Compra (Carregar Lista)</button>
        <button class="btn btn-outline-danger" onclick="limparTudo()">Limpar Tudo</button>
    </div>
</div>

<!-- JavaScript Integrado -->
<script>
    // Carrega os itens salvos ou cria um array vazio
    let itens = JSON.parse(localStorage.getItem('appMercado_itens')) || [];

    // Função para renderizar (desenhar) a lista na tela
    function renderizarLista() {
        const lista = document.getElementById('listaItens');
        lista.innerHTML = '';
        let total = 0;

        itens.forEach((item, index) => {
            if (item.comprado) {
                total += item.preco;
            }

            const li = document.createElement('li');
            li.className = `list-group-item d-flex justify-content-between align-items-center ${item.comprado ? 'item-comprado' : ''}`;
            
            // Montando o HTML de cada item
            li.innerHTML = `
                <div class="cursor-pointer flex-grow-1" onclick="alternarComprado(${index})">
                    <div class="item-nome fs-5">${item.nome}</div>
                    ${item.ultimoPreco ? `<small class="text-muted">Último valor pago: R$ ${item.ultimoPreco.toFixed(2)}</small>` : ''}
                </div>
                <div class="d-flex align-items-center">
                    ${item.comprado ? 
                        `<div class="input-group input-group-sm me-2 price-input">
                            <span class="input-group-text">R$</span>
                            <input type="number" step="0.01" class="form-control" value="${item.preco \vert{}\vert{} ''}" onchange="atualizarPreco(${index}, this.value)" placeholder="0.00">
                        </div>` 
                        : ''}
                    <button class="btn btn-sm btn-danger" onclick="removerItem(${index})">🗑️</button>
                </div>
            `;
            lista.appendChild(li);
        });

        // Atualiza o total na tela
        document.getElementById('valorTotal').innerText = total.toFixed(2);
        
        // Salva as alterações locais
        salvarDados();
    }

    // Adiciona um novo item
    function adicionarItem() {
        const input = document.getElementById('novoItem');
        const nomeItem = input.value.trim();
        
        if (nomeItem !== '') {
            itens.push({ 
                nome: nomeItem, 
                comprado: false, 
                preco: 0,
                ultimoPreco: null 
            });
            input.value = ''; // Limpa o campo
            renderizarLista();
        }
    }

    // Permite adicionar com a tecla "Enter"
    document.getElementById('novoItem').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') adicionarItem();
    });

    // Clica para marcar/desmarcar como comprado
    function alternarComprado(index) {
        itens[index].comprado = !itens[index].comprado;
        if (!itens[index].comprado) {
            itens[index].preco = 0; // Zera o preço atual se desmarcar
        }
        renderizarLista();
    }

    // Atualiza o valor quando o usuário digita
    function atualizarPreco(index, valor) {
        itens[index].preco = parseFloat(valor) || 0;
        renderizarLista();
    }

    // Remove item da lista
    function removerItem(index) {
        itens.splice(index, 1);
        renderizarLista();
    }

    // Salva a lista atual no armazenamento do navegador
    function salvarDados() {
        localStorage.setItem('appMercado_itens', JSON.stringify(itens));
    }

    // Salva a lista como base para compras futuras, guardando o histórico de preços
    function salvarComoModelo() {
        if (itens.length === 0) {
            alert('A lista está vazia!');
            return;
        }
        const modelo = itens.map(item => ({
            nome: item.nome,
            comprado: false,
            preco: 0,
            // Guarda o preço atual como "último preço" para comparação futura
            ultimoPreco: item.preco > 0 ? item.preco : item.ultimoPreco
        }));
        
        localStorage.setItem('appMercado_modelo', JSON.stringify(modelo));
        alert('Lista salva para o futuro! Na próxima compra, você verá os últimos preços para comparar.');
    }

    // Carrega o modelo salvo, zerando a lista para uma nova compra
    function carregarModelo() {
        const modeloLocal = localStorage.getItem('appMercado_modelo');
        if (modeloLocal) {
            if (confirm('Isso vai apagar o progresso da lista atual e iniciar uma nova compra baseada no seu modelo salvo. Quer continuar?')) {
                itens = JSON.parse(modeloLocal);
                renderizarLista();
            }
        } else {
            alert('Você ainda não tem nenhuma lista salva para compras futuras.');
        }
    }

    // Limpa toda a tela e o histórico atual (não apaga o modelo salvo)
    function limparTudo() {
        if (confirm('Tem certeza que deseja apagar todos os itens desta lista?')) {
            itens = [];
            renderizarLista();
        }
    }

    // Inicia a tela desenhando o que já tem salvo
    renderizarLista();

</script>
</body>
</html>
